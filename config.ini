; ============================================================
;  Configuração do envio de extratos de fretes para agregados
; ============================================================

[planilha]
; Planilha padrão (no executável, a planilha é escolhida na tela)
arquivo =
; Nome da aba com os fretes. Se não existir, usa a primeira aba que não seja a de cadastro
aba = VW

; Nomes EXATOS dos cabeçalhos das colunas na planilha
coluna_documento = CNPJ / CPF
coluna_nome = Agregado
; Coluna com o e-mail na aba de fretes (não usada quando [cadastro] tem aba)
coluna_email =

; Colunas que aparecerão na tabela do e-mail, na ordem desejada
; (deixe vazio para mostrar todas, exceto documento, nome e e-mail)
colunas_exibidas = Nº Referência, Manifesto, CIOT Sistema, Placa Veiculo, Origem, Destino, Saldo
; Colunas formatadas como moeda (R$) e somadas no total
colunas_moeda = Saldo
; Colunas formatadas como data (dd/mm/aaaa)
colunas_data =
; Coluna usada como período no e-mail/assunto (ex.: "VW SEMANA 42 - VCTO 04-11-2026").
; Usada quando [email] periodo estiver vazio e --periodo não for informado.
coluna_periodo = Tipo Operação

[cadastro]
; Aba separada com o e-mail de cada agregado (colunas documento + email).
; Se vazio, usa a coluna_email da própria aba de fretes.
aba = Emails
coluna_documento = CNPJ / CPF
coluna_email = Email

[email]
; metodo = outlook  -> usa o Outlook instalado neste computador (não precisa de senha)
; metodo = smtp     -> usa um servidor SMTP (configure a seção [smtp])
metodo = smtp
; Assunto. Pode usar {nome}, {semana}, {documento} e {periodo}
; {semana} vem da coluna_periodo: "VW SEMANA 42 - VCTO..." -> "Semana 42"
assunto = Extrato de Fretes - {nome} - {semana}
; Período fixo (deixe vazio para usar a coluna_periodo da planilha)
periodo =
; Remetente padrão (pode ser alterado na tela). Vazio = remetente da seção [smtp]
; (ou o e-mail logado, no método outlook). Outro endereço exige permissão "Enviar como".
enviar_como =
; Cópia para (separe vários por ;)
cc = ti@tcm.com.br
; Intervalo entre um envio e outro, em segundos (evita bloqueio por excesso de envios)
intervalo_segundos = 5
; Assinatura no final do e-mail
assinatura = Equipe Financeiro - TCM Logística

[smtp]
; Conexão sempre com STARTTLS e certificado verificado
servidor = smtp.office365.com
porta = 587
; Usuário e senha ficam no arquivo .env (SMTP_USUARIO e SMTP_SENHA), nunca aqui
remetente = envios@tcm.com.br
; Nome exibido ao destinatário (opcional; vazio = só o endereço)
nome_remetente =
